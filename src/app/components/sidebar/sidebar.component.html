<div
    style="width: 260px; height: 100vh; background-color: white; border-right: 1px solid #dee2e6; padding: 1.5rem 1rem; box-shadow: 2px 0 5px rgba(0,0,0,0.05); display: flex; flex-direction: column;">

    <div>
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: var(--primary-color); margin: 0; font-size: 1.8rem;">ERP</h2>
            <span style="color: #666; font-size: 0.85rem;">Panel de Administración</span>
        </div>

        <p-menu [model]="items" [style]="{'width': '100%', 'border': 'none'}"></p-menu>
    </div>

    <div style="margin-top: auto; text-align: center; padding-top: 1rem; border-top: 1px solid #eee; color: #999;">
        <p style="margin: 0; font-weight: bold; font-size: 0.9rem;">v1.0.0</p>
        <p style="margin: 0; font-size: 0.8rem;">Versión de la App</p>
    </div>

</div>
