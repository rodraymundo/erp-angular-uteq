<h1 style="color: #333; margin-top: 0; margin-bottom: 2rem;">Grupos</h1>

<div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 700px;">

    <p-card header="Total de Grupos" [style]="{ width: '100%' }">
        <p style="font-size: 2.5rem; font-weight: bold; color: var(--primary-color); margin: 0;">5</p>
        <p style="color: #666; margin-top: 0.5rem; margin-bottom: 0;">Grupos activos en el sistema</p>
    </p-card>

    <p-card header="Avance de Proyectos" [style]="{ width: '100%' }">
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="font-weight: 500; color: #333;">Grupo IDGS14</span>
                    <span style="font-weight: bold; color: var(--primary-color);">85%</span>
                </div>
                <div style="height: 12px; background-color: #eee; border-radius: 6px; overflow: hidden;">
                    <div style="height: 100%; width: 85%; background-color: var(--primary-color);"></div>
                </div>
            </div>
        </div>
    </p-card>

</div>
