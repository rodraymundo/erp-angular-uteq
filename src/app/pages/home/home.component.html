<h1 style="color: #333; margin-top: 0; margin-bottom: 2rem;">Home</h1>

<div style="display: flex; gap: 1.5rem; flex-wrap: wrap;">

    <p-card header="Usuarios Activos" [style]="{ width: '300px' }">
        <p style="font-size: 2.5rem; font-weight: bold; color: var(--primary-color); margin: 0;">1,254</p>
        <p style="color: #666; margin-top: 0.5rem; margin-bottom: 0;">En la última semana</p>
    </p-card>

    <p-card header="Ventas del Mes" [style]="{ width: '300px' }">
        <p style="font-size: 2.5rem; font-weight: bold; color: #22c55e; margin: 0;">$45,230</p>
        <p style="color: #666; margin-top: 0.5rem; margin-bottom: 0;">+12% vs mes anterior</p>
    </p-card>

    <p-card header="Tareas Pendientes" [style]="{ width: '300px' }">
        <p style="font-size: 2.5rem; font-weight: bold; color: #f59e0b; margin: 0;">8</p>
        <p style="color: #666; margin-top: 0.5rem; margin-bottom: 0;">Requieren atención</p>
    </p-card>

</div>
